<!-- Coins -->

<div class="entity coin" style="left: 200px; top: 120px; width: 16px; height: 16px;"></div>




            </div>


            <div id="hud" class="active">
                <div>SCORE <span id="score-val">0</span></div>
                <div>COINS <span id="coins-val">0</span></div>
                <div>HI-SCORE <span id="hi-score-val">0</span></div>
            </div>
        </div>

        <div id="start-screen" class="overlay-screen hidden">
            <div class="menu-box">
                <h1>MARIO RUN WEB</h1>
                <p>Endless auto-runner. Press SPACE / UP / W to Jump.</p>
                <button id="start-btn" class="action-btn">START GAME</button>
            </div>
        </div>

        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="menu-box">
                <h2 class="danger-text">GAME OVER</h2>
                <p>You fell! Try to beat the high score.</p>
                <p>Final Score: <span id="final-score"></span></p>
                <p>High Score: <span id="high-score"></span></p>
                <button id="restart-btn" class="action-btn">RETRY</button>
            </div>
        </div>
    </div>
